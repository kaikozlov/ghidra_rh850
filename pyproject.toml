[project]
name = "ghidra-rh850-analysis-tooling"
version = "0.1.0"
description = "RH850/Toyota firmware reverse-engineering and analysis tooling"
requires-python = ">=3.11"
dependencies = [
    "dncil==1.0.2",
    "dnfile==0.18.0",
    "pefile==2024.8.26",
    "pycryptodome==3.23.0",
    "unicorn==2.1.4",
    "numpy==2.4.6",
    "systemrdl-compiler>=1.33.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Checkout tooling: uv sync installs this project editable from the source
# tree, so operational code is never relocated into site-packages and module
# __file__ paths keep resolving inside the checkout.
include = ["tools", "tools.*", "exploit", "exploit.*", "tsk", "tsk.*", "tests", "tests.*"]
namespaces = true
