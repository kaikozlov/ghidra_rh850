[suite.techstream_rks]
tests = ["tests/verify_techstream_rks.py"]
paths = ["docs/tooling/techstream.md", "techstream.lock.json"]
# External-tree suite: verifies TMS-009 (CUW RKS / two-layer reflash
# authorization). SKIPs cleanly (exit 0) when the gitignored Techstream/
# unpacked tree is absent, so it never breaks core verify. Run on a host
# where Techstream/unpacked/ is populated, or via: make verify-one SUITE=techstream_rks

[suite.techstream_ptshim]
tests = ["tests/verify_techstream_ptshim.py"]
paths = ["docs/tooling/techstream.md", "tools/techstream/parse_ptshim_log.py", "tests/fixtures/techstream/", "techstream.lock.json"]
# Synthetic fixtures always exercise the parser; binary body/path/timestamp
# locks are additionally checked when the gitignored Techstream tree is present.

[suite.techstream_ddb_residuals]
tests = ["tests/verify_techstream_ddb_residuals.py"]
paths = ["docs/tooling/techstream.md", "docs/tooling/techstream-ddb-pipeline.md", "tools/techstream/parse_ddb.py", "techstream.lock.json"]
# Bounded current-state audit: Security_P4 high-value unknowns plus the separate
# Toyota.ddb type-1 master-enumeration schema. SKIPs when the external tree is absent.

[suite.techstream_mackey]
tests = ["tests/verify_techstream_mackey.py"]
paths = ["docs/security/mackey-registration.md", "docs/tooling/techstream.md", "tools/techstream/inspect_dotnet_il.py"]
# External-tree suite: verifies TMS-011 against native exports/imports and the
# managed IT3UtilityRevNK IL. SKIPs cleanly when Techstream/unpacked is absent.

[suite.techstream_layerb]
tests = ["tests/verify_techstream_layerb.py"]
paths = ["docs/tooling/techstream.md"]
# External-tree suite: verifies TMS-010 (VFOREST flash-writer SA transmission /
# SendNonceAndSeedKey; no static AES in the CUW reflash toolchain). SKIPs
# cleanly (exit 0) when the gitignored Techstream/unpacked tree is absent, so
# it never breaks core verify. Run via: make verify-one SUITE=techstream_layerb

[suite.community_tooling]
tests = ["tests/verify_community_tooling.py"]
paths = ["community/", "external-references.lock.json"]
# Cross-validates community exploit tooling (blurbdust/@yc flash patcher,
# egg-hunter shellcode, CUW decryptor) against repository findings SEC-BOOT-002..007,
# SECOC-024, SECOC-028. Verifies SHA-256 integrity of committed artifacts.

