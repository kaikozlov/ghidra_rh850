# Explicit verification suite registry.
#
# This file names runnable suites and optional external prerequisites. It is NOT
# a changed-file ownership graph. `tools/test` never infers a test plan from the
# working tree, documentation, status ledgers, or provenance metadata.
#

[verification]
# Portable proofs default to the exhaustive full/local tiers.  The small core
# smoke tier is centralized here so new evidence suites do not silently bloat it.
default_modes = ["full", "local"]
core_suites = [
  "analysis_targets",
  "annotation_ledger",
  "build_layout",
  "fast_verify",
]

[verification.groups]
# Cross-family deliberate bundles live here rather than growing Make wrappers.
exploit = [
  "exploit",
  "secoc_manifest_patcher",
  "codeflash_dumper",
  "ephemeral_runtime",
  "ephemeral_runtime_live_installer",
  "ephemeral_runtime_resolver",
  "secoc_command5",
  "secoc_mac28_behavioral_proof",
  "variant_acquisition_readiness",
]

# Repository artifacts checked outside tools/test.
[catalog.processor_audit]
gate = "make verify-processor"
paths = [
  "data/decompiler_signatures.baseline.csv",
  "data/instruction_inventory.csv",
  "data/processor_manifest.baseline.json",
  "data/processor_unimpl_allowlist.txt",
  "data/switch_table_inventory.csv",
]

[external.techstream_v18]
path = "software/Techstream/v18/unpacked/toyota/Toyota Diagnostics"
env = "TECHSTREAM_UNPACKED_ROOT"
description = "Pinned proprietary Techstream V18 extracted distribution"

[external.cuw_reference_corpus]
path = "software/Techstream/cuw"
env = "TOYOTA_CUW_CORPUS_ROOT"
description = "Pinned external Toyota CUW specimen corpus"

[external.gtsplus]
path = "software/Techstream/gtsplus"
env = "GTSPLUS_ROOT"
description = "Pinned proprietary GTS+ distribution and derived local reconstruction corpus"

