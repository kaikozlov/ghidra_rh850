# Verification ownership map.
#
# Maps subsystem suites to the files that own them, enabling:
#   make verify-one SUITE=<name>    — run a single suite
#   make verify-changed             — run suites affected by git changes
#   make verify-agent               — compact JSON summary, full logs on failure
#
# This is the authoritative suite manifest. Add each gate exactly once.

[verification]
default_oracle = "raw_bytes"
skip_exit_code = 77
gate_glob = "tests/verify_*.py"

[external.techstream_v18]
path = "Techstream/unpacked/toyota/Toyota Diagnostics"
env = "TECHSTREAM_UNPACKED_ROOT"
description = "Pinned proprietary Techstream V18 extracted distribution"

[suite.architecture]
tests = ["tests/verify_architecture.py"]
paths = [
  "docs/architecture/",
  "data/ram_overlay_map.csv",
  "data/control_partition.csv",
]

