# Verification ownership map.
#
# Maps subsystem suites to the files that own them, enabling:
#   make verify-one SUITE=<name>    — run a single suite
#   make verify-changed             — run suites affected by git changes
#   make verify-agent               — compact JSON summary, full logs on failure
#
# This is a hand-maintained mapping. Add entries when you create new suites.

[suite.architecture]
tests = ["tests/verify_architecture.py"]
paths = [
  "docs/architecture/",
  "data/ram_overlay_map.csv",
  "data/control_partition.csv",
]

[suite.boot_trust]
tests = ["tests/verify_boot_trust.py"]
paths = ["docs/security/bootloader-payload-gate.md"]

[suite.bootloader_diagnostics]
tests = ["tests/verify_bootloader_diagnostics.py"]
paths = ["docs/diagnostics/bootloader.md", "docs/diagnostics/bootloader-dids.md"]

[suite.bootloader_secrets]
