# Verification ownership map.
#
# Maps verification suites to the files that can invalidate them, enabling:
#   tools/test                     — dirty + untracked vs HEAD
#   tools/test branch              — PR-shaped: merge-base with upstream
#   tools/test <suite-or-prefix>   — run one suite or a prefix family
#   tools/test list [query]        — discover suite ownership and modes
#   make verify-agent              — compact core summary, full logs on failure
#
# `suite.*.paths` records only non-obvious invalidation edges. Statically resolvable
# Python dependencies are derived from verifier file access/import/subprocess expressions
# by `tools/verification_deps.py`; keep string-table/shell-indirection dependencies here
# explicitly instead of teaching the scanner to guess. Non-routing artifact
# ownership belongs under `catalog.*` instead. This is the authoritative suite manifest:
# add each gate exactly once.

[verification]
default_oracle = "raw_bytes"
skip_exit_code = 77
gate_glob = "tests/verify_*.py"
# Portable proofs default to the exhaustive full/local tiers.  The small core
# smoke tier is centralized here so new evidence suites do not silently bloat it.
default_modes = ["full", "local"]
core_suites = [
  "analysis_status",
  "analysis_targets",
  "annotation_ledger",
  "architecture",
  "build_layout",
  "control_partition",
  "doc_links",
  "fast_verify",
  "knowledge_index",
  "software_layout",
  "target_artifact_manifest",
  "tooling_consolidation",
]
aggregate_infrastructure_suites = ["analysis_status", "doc_links", "knowledge_index"]

[verification.groups]
# Cross-family deliberate bundles live here rather than growing Make wrappers.
exploit = [
  "exploit",
  "secoc_manifest_patcher",
  "codeflash_dumper",
  "ephemeral_runtime",
  "ephemeral_runtime_live_installer",
  "ephemeral_runtime_resolver",
  "secoc_command5",
  "secoc_mac28_behavioral_proof",
  "variant_acquisition_readiness",
]

# Repository artifacts checked outside tools/test. These paths remain visible in
# the knowledge index without polluting changed-file suite selection.
[catalog.processor_audit]
gate = "make verify-processor"
paths = [
  "data/decompiler_signatures.baseline.csv",
  "data/instruction_inventory.csv",
  "data/processor_manifest.baseline.json",
  "data/processor_unimpl_allowlist.txt",
  "data/switch_table_inventory.csv",
]

[external.techstream_v18]
path = "software/Techstream/v18/unpacked/toyota/Toyota Diagnostics"
env = "TECHSTREAM_UNPACKED_ROOT"
description = "Pinned proprietary Techstream V18 extracted distribution"

[external.cuw_reference_corpus]
path = "software/Techstream/cuw"
env = "TOYOTA_CUW_CORPUS_ROOT"
description = "Pinned external Toyota CUW specimen corpus"

[external.gtsplus]
path = "software/Techstream/gtsplus"
env = "GTSPLUS_ROOT"
description = "Pinned proprietary GTS+ distribution and derived local reconstruction corpus"

