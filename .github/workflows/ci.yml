name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-firmware:
    name: Firmware suites (make verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make verify

  changes:
    name: Path filter
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      processor: ${{ steps.filter.outputs.processor }}
      rebuild: ${{ steps.filter.outputs.rebuild }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            processor:
              - 'Makefile'
              - 'verification.toml'
              - 'ghidra/ghidra_v850/**'
              - 'tools/install_v850_extension.sh'
              - 'tools/verify_sleigh.sh'
              - 'tools/verify_processor.sh'
              - 'tools/run_headless'
              - 'tools/lib/ghidra_env.sh'
              - 'tools/project_layout.py'
              - 'tools/project_inventory.py'
              - 'tools/generate_project_inventory.sh'
              - 'tools/snapshot_project.sh'
              - 'tools/finalize_project.sh'
              - 'tools/fingerprint_processor.py'
              - 'tools/build_processor_fixture.py'
              - 'tools/rebuild_project.sh'
              - 'ghidra/scripts/verify/**'
              - 'tests/fixtures/processor/**'
              - 'tests/verify_lifecycle.py'
              - 'tests/verify_project_layout.py'
              - 'tests/verify_headless_runner.py'
              - 'tests/verify_ghidra_env.py'
              - 'tests/verify_project_inventory.py'
              - 'data/processor_unimpl_allowlist.txt'
              - 'data/processor_manifest.baseline.json'
              - 'data/decompiler_signatures.baseline.csv'
              - 'data/ghidra_project_inventory.baseline.jsonl'
              - 'project/**'
            cli:
              - 'ghidra/ghidra-cli/**'
              - 'tools/build_ghidra_cli.sh'
              - 'tools/g'
            rebuild:
              - 'Makefile'
              - 'verification.toml'
              - 'ghidra/ghidra_v850/**'
              - 'ghidra/scripts/import/**'
              - 'ghidra/scripts/seed/**'
              - 'ghidra/scripts/annotate/**'
              - 'ghidra/scripts/verify/**'
              - 'tools/rebuild_project.sh'
              - 'tools/snapshot_project.sh'
              - 'tools/finalize_project.sh'
              - 'tools/run_headless'
              - 'tools/lib/ghidra_env.sh'
              - 'tools/project_layout.py'
              - 'tools/project_inventory.py'
              - 'tools/generate_project_inventory.sh'
              - 'tests/verify_lifecycle.py'
              - 'tests/verify_project_layout.py'
              - 'tests/verify_headless_runner.py'
              - 'tests/verify_ghidra_env.py'
              - 'tests/verify_project_inventory.py'
              - 'tools/verify_ghidra_stats.py'
              - 'tools/install_v850_extension.sh'
              - 'tools/fingerprint_processor.py'
              - 'data/p1m_sfr_labels.csv'
              - 'data/processor_unimpl_allowlist.txt'
              - 'data/decompiler_signatures.baseline.csv'
              - 'data/ghidra_project_inventory.baseline.jsonl'
              - 'data/generated/21140bbd65e530a9/diagnostic_vocabulary.json'
              - 'project/**'

  verify-processor:
    name: SLEIGH + processor/project audits
    needs: [changes]
    if: >
      always() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && needs.changes.outputs.processor == 'true') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Ghidra 12.1.3
        run: |
          set -euo pipefail
          brew install ghidra
          GHIDRA_HOME="$(brew --prefix ghidra)/libexec"
          VER=$(awk -F= '$1 == "application.version" { print $2 }' "$GHIDRA_HOME/Ghidra/application.properties")
          echo "Ghidra version: $VER"
          test "$VER" = "12.1.3"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_HOME" >> "$GITHUB_ENV"
      - name: Install pinned ghidra CLI
        run: |
          cargo install ghidra-cli --version 0.2.1 --locked
          test "$(ghidra --version | awk 'NR == 1 { print $2 }')" = "0.2.1"
      - run: make verify-sleigh
      - run: make work-project
      - run: make verify-processor
      - run: make verify-project-parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: processor-audit-logs
          path: |
            build/sleigh-logs/
            build/processor_manifest.json
            build/verify-processor-*.log
            build/decompiler-signatures.txt
            build/ghidra_project_inventory.jsonl
            data/instruction_inventory.csv
            tests/fixtures/processor/
          if-no-files-found: ignore

  cli:
    name: ghidra-cli unit tests
    needs: [changes]
    if: >-
      always() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && needs.changes.outputs.cli == 'true') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile-check all tests (catches compile errors in Ghidra-backed tests too)
        run: cargo test --locked --manifest-path ghidra/ghidra-cli/Cargo.toml --no-run
      - name: Run Ghidra-free unit tests
        run: |
          cargo test --locked --manifest-path ghidra/ghidra-cli/Cargo.toml --lib
          cargo test --locked --manifest-path ghidra/ghidra-cli/Cargo.toml --test batch_tests

  rebuild-parity:
    name: Four-stage rebuild parity
    needs: [changes]
    if: >
      always() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && needs.changes.outputs.rebuild == 'true') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Ghidra 12.1.3
        run: |
          set -euo pipefail
          brew install ghidra
          GHIDRA_HOME="$(brew --prefix ghidra)/libexec"
          VER=$(awk -F= '$1 == "application.version" { print $2 }' "$GHIDRA_HOME/Ghidra/application.properties")
          test "$VER" = "12.1.3"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
          echo "GHIDRA_INSTALL_DIR=$GHIDRA_HOME" >> "$GITHUB_ENV"
      - name: Install pinned ghidra CLI
        run: |
          cargo install ghidra-cli --version 0.2.1 --locked
          test "$(ghidra --version | awk 'NR == 1 { print $2 }')" = "0.2.1"
      - run: make rebuild-project
      - run: make verify-processor
      - run: make verify-project-parity
      - name: Compare rebuilt processor manifest with snapshot
        run: cmp build/project/processor_manifest.json project/processor_manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuild-parity-artifacts
          path: |
            build/sleigh-logs/
            build/processor_manifest.json
            build/project/processor_manifest.json
            build/verify-processor-*.log
            build/decompiler-signatures.txt
            build/ghidra_project_inventory.jsonl
            data/instruction_inventory.csv
          if-no-files-found: ignore
